name: Test Suite

# Runs the Rust scoring-engine test suite and the Playwright UI smoke suite so that
# docs/scoped/testing-strategy.md's "cargo test passes locally and in CI" merge rule
# (and Phase 3's browser flow) are actually enforced, not just claimed.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "test/**"

jobs:
  test:
    name: cargo test
    # macos-latest matches the platform this project is developed on. Tauri v2 is a
    # dependency of the whole crate, and on Linux that additionally requires installing
    # webkit2gtk/appindicator/etc. system packages before anything will compile. macOS
    # (and Windows) runners need no extra setup, so this avoids that whole class of
    # CI-only failures.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run scoring engine test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  e2e:
    name: playwright ui smoke
    # Same platform constraint as the cargo test job above: playwright.config.ts's
    # webServer boots the pageant-server bin, which links the same Tauri-dependent lib crate.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
